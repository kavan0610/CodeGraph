<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeGraph Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-darkbg text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Navigation Bar -->
  <header class="h-14 border-b border-border bg-panel flex items-center justify-between px-6 shrink-0 z-10">
    <div class="flex items-center gap-3">
      <span class="text-xl">🕸️</span>
      <h1 class="font-bold text-lg tracking-wide text-cyan-400">CodeGraph <span class="text-xs text-slate-400 font-normal">Studio</span></h1>
    </div>
    <button onclick="window.toggleModal('config-modal')" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-300 hover:bg-slate-800 border border-border">
      Settings
    </button>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Left: Graph Explorer -->
    <div class="flex-1 relative bg-slate-950 h-full">
      <div id="network-canvas"></div>
      <div class="absolute bottom-4 left-4 bg-panel/90 backdrop-blur p-3 rounded-lg border border-border text-xs flex flex-wrap gap-4 max-w-2xl">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#8b5cf6]"></span> Class</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#3b82f6]"></span> Function</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#06b6d4]"></span> Method</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#64748b]"></span> Module</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#f59e0b]"></span> Variable</div>
      </div>
    </div>

    <!-- Right: Control Panel (3 Tabs) -->
    <aside class="w-[450px] border-l border-border bg-panel flex flex-col shrink-0 h-full">
      
      <!-- Tab Headers -->
      <div class="flex border-b border-border shrink-0">
        <button onclick="window.setTab('structural')" id="btn-structural" class="flex-1 py-3 text-sm font-semibold border-b-2 border-cyan-500 text-cyan-400">Structural</button>
        <button onclick="window.setTab('semantic')" id="btn-semantic" class="flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">Semantic</button>
        <button onclick="window.setTab('chat')" id="btn-chat" class="flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">AI Chat</button>
      </div>

      <!-- TAB: STRUCTURAL -->
      <div id="tab-structural" class="flex flex-col p-4 h-full overflow-hidden">
        <div class="shrink-0 mb-4">
          <label class="text-xs font-semibold text-slate-400 uppercase mb-1 block">Target Node</label>
          <input id="struct-target" type="text" autocomplete="off" placeholder="Click a node or type a name..." class="w-full px-3 py-2 bg-slate-900 border border-border rounded text-sm focus:outline-none focus:border-cyan-500 mb-3" onkeydown="if(event.key==='Enter') window.runStructural('find')" oninput="window.currentSelectedNodeId = null" />
          
          <div class="grid grid-cols-2 gap-2">
            <button onclick="window.runStructural('callers')" class="py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold">Callers</button>
            <button onclick="window.runStructural('callees')" class="py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold">Callees</button>
            <button onclick="window.runStructural('trace')" class="py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold">Trace</button>
            <button onclick="window.runStructural('blast')" class="py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold">Blast Radius</button>
          </div>
        </div>
        <div id="inspector-details" class="flex-1 bg-slate-900 p-3 rounded border border-border text-xs overflow-y-auto text-slate-300">
          <p class="text-slate-500 italic text-center mt-10">Select a node to view structural relationships.</p>
        </div>
      </div>

      <!-- TAB: SEMANTIC -->
      <div id="tab-semantic" class="hidden flex flex-col p-4 h-full overflow-hidden">
        <div class="shrink-0 mb-4 flex gap-2">
          <input id="semantic-input" type="text" autocomplete="off" placeholder="Search concepts..." class="flex-1 px-3 py-2 bg-slate-900 border border-border rounded text-sm focus:outline-none focus:border-cyan-500" onkeydown="if(event.key==='Enter') window.runSemantic()" />
          <button onclick="window.runSemantic()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded text-sm font-semibold">Search</button>
        </div>
        <div id="semantic-results" class="flex-1 overflow-y-auto flex flex-col gap-2">
          <p class="text-slate-500 italic text-center mt-10 text-xs">Search in natural language to find related nodes.</p>
        </div>
      </div>

      <!-- TAB: CHAT -->
      <div id="tab-chat" class="hidden flex flex-col p-4 h-full overflow-hidden">
        <div id="chat-history" class="flex-1 bg-slate-900 border border-border rounded p-3 overflow-y-auto flex flex-col gap-3 text-sm mb-3">
          <div class="text-slate-500 italic text-xs text-center mt-4">Ask AI. The agent will read the graph and source code.</div>
        </div>
        <div class="flex gap-2 shrink-0">
          <button onclick="window.clearChat()" title="Clear History" class="px-3 py-2 bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-400 rounded text-sm border border-border transition-colors">Clear</button>
          <input id="chat-input" type="text" placeholder="Ask AI..." class="flex-1 px-3 py-2 bg-slate-900 border border-border rounded text-sm focus:outline-none focus:border-cyan-500 text-slate-200" onkeydown="if(event.key==='Enter') window.sendChat()" />
          <button onclick="window.sendChat()" id="btn-send-chat" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded text-sm font-semibold text-white">Send</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Config Modal -->
  <div id="config-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-panel w-[500px] border border-border rounded-lg shadow-2xl p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">CodeGraph Settings</h2>
        <button onclick="window.toggleModal('config-modal')" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
      </div>
      
      <div class="flex flex-col gap-3">
        <h3 class="text-xs font-bold text-slate-300 uppercase mt-2">LLM Provider</h3>
        <label class="text-xs text-slate-400 -mb-2">Provider</label>
        <select id="cfg-provider" class="w-full px-3 py-2 bg-slate-900 border border-border rounded text-sm">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Gemini</option>
          <option value="ollama">Ollama</option>
          <option value="custom">Custom (LM Studio/Groq)</option>
        </select>
        
        <label class="text-xs text-slate-400 -mb-2 mt-1">Model Name</label>
        <input id="cfg-model" type="text" class="w-full px-3 py-2 bg-slate-900 border border-border rounded text-sm" />
        
        <label class="text-xs text-slate-400 -mb-2 mt-1">Base URL</label>
        <input id="cfg-base-url" type="text" placeholder="Optional (e.g. http://localhost:11434)" class="w-full px-3 py-2 bg-slate-900 border border-border rounded text-sm" />
        
        <label class="text-xs text-slate-400 -mb-2 mt-1">API Key</label>
        <input id="cfg-api-key" type="password" placeholder="Leave blank for local models" class="w-full px-3 py-2 bg-slate-900 border border-border rounded text-sm" />

        <h3 class="text-xs font-bold text-slate-300 uppercase mt-4">Search Preferences</h3>
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="text-xs text-slate-400">Max Depth (Trace/Blast)</label>
            <input id="cfg-depth" type="number" min="1" max="5" class="w-full px-3 py-2 mt-1 bg-slate-900 border border-border rounded text-sm" />
          </div>
          <div class="flex-1">
            <label class="text-xs text-slate-400">Semantic Top K</label>
            <input id="cfg-topk" type="number" min="1" max="20" class="w-full px-3 py-2 mt-1 bg-slate-900 border border-border rounded text-sm" />
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button onclick="window.toggleModal('config-modal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Cancel</button>
          <button onclick="window.saveConfig()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-semibold shadow-lg">Save Settings</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
